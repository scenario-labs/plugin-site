name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: No em dashes, machine paths or stray addresses; JSON and JavaScript parse; actions pinned
        run: node tools/lint.js

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # The builder uses Node's built-in modules only: no install step.
      - name: The handbook builder against the sample plug-in
        run: node --test --test-reporter=spec test/config.test.js test/handbook.test.js test/markdown.test.js

  agents:
    name: agents
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Shared agent skills are valid and linked for Claude Code
        env:
          SKILLS_REF: git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
        run: |
          for d in .agents/skills/*/; do
            n="$(basename "$d")"
            uvx --from "$SKILLS_REF" skills-ref validate "$d"
            [ "$(readlink ".claude/skills/$n")" = "../../.agents/skills/$n" ] || { echo "::error::.claude/skills/$n must link to ../../.agents/skills/$n"; exit 1; }
          done
          [ "$(readlink .claude/CLAUDE.md)" = "../AGENTS.md" ] || { echo "::error::.claude/CLAUDE.md must link to ../AGENTS.md"; exit 1; }

  # The one check the main rulesets require from this workflow, so jobs can be
  # added or renamed without touching the rulesets. Do not rename it.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, agents]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A CI job did not succeed: $RESULTS"
              exit 1
            fi
          done
